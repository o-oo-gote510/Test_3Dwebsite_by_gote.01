<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Three.js test</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial, Helvetica, sans-serif;
    background:#f5f6fa;
    color:#222;

}

header{

    width:100%;
    background:white;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
    padding:60px;

}

.container{

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:50px;

}

.left{

    flex:1;

}

.left h1{

    font-size:64px;
    margin-bottom:20px;
    color:#2c3e50;

}

.left p{

    font-size:20px;
    line-height:1.8;
    color:#555;

}

.right{

    width:600px;
    height:500px;

    border-radius:20px;
    overflow:hidden;

    background:white;

    box-shadow:0 10px 30px rgba(0,0,0,.15);

}

canvas{

    display:block;

}

section{

    max-width:1200px;
    margin:auto;
    padding:60px;

}

section h2{

    margin-bottom:20px;

}

</style>


<script type="importmap">
{
  "imports": {
    "three":"https://unpkg.com/three@0.180.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"
}
}
</script>

</head>
<body>


<header>

<div class="container">

<div class="left">

<h1>Three.js test</h1>

<p>

Blenderで作成したGLBモデルをThree.jsで表示しています。<br>

右側のモデルはドラッグで自由に回転できます。

</p>

</div>

<div class="right" id="viewer"></div>

</div>

</header>


<section>

<h2>About</h2>

<p>

ここにホームページ本文を書いていきます。

Three.jsはHTMLの一部として表示できるため、

普通のWebページと3Dコンテンツを自然に組み合わせられます。

</p>

</section>

<script type="module">

import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

//「three.jsの描画領域を表示するdiv要素を取得」
const viewer=document.getElementById("viewer");//three.jsの描画領域を表示するdiv要素を取得 

//「描画装置を作成」
const renderer=new THREE.WebGLRenderer({antialias:true});//レンダラーを作成
viewer.appendChild(renderer.domElement);//レンダラーの描画領域をdiv要素に追加
renderer.setPixelRatio(window.devicePixelRatio);//レンダラーのピクセル比を設定
renderer.setSize(viewer.clientWidth*1,viewer.clientHeight*1);//レンダラーの描画サイズを設定


/*オブジェクトの配置*/

//「シーン(ワールド)を作成」
const scene=new THREE.Scene();//three.jsのシーンを作成
scene.background=new THREE.Color(0x00a0a0);//シーンの背景色を設定

//「カメラの作成・追加」
const camera=new THREE.PerspectiveCamera(45,viewer.clientWidth/viewer.clientHeight,0.1,1000);//カメラを作成
camera.position.set(0,20,50);//カメラの位置を設定
const controls=new OrbitControls(camera,renderer.domElement);//orbitControlsを作成
controls.enableDamping=true;//カメラの制御に慣性をつける

//「ライトの作成・追加」
const light=new THREE.DirectionalLight(0xffffff,10);//光源を作成
light.position.set(5,5,5);
scene.add(light);//シーンに光源を追加

//「GLBモデルを読み込むためのGLTFLoaderを作成」
const loader=new GLTFLoader();
loader.load("a.glb",(gltf)=>{
const model=gltf.scene;//GLBモデルを読み込む
scene.add(model);//シーンにGLBモデルを追加
}
);

/*オブジェクトの配置システム処理*/
//「リアルタイムで描画」
function animate(){
controls.update();//orbitcontrolsのカメラの制御を更新
renderer.render(scene,camera);//three.jsのシーンのレンダリングを更新
}
renderer.setAnimationLoop(animate);//関数animateを継続的に実行


//ウィンドウサイズ変化に対応する
window.addEventListener("resize",()=>{
renderer.setSize(viewer.clientWidth,viewer.clientHeight);//レンダラーの描画サイズを更新
camera.aspect=viewer.clientWidth/viewer.clientHeight;//カメラのアスペクト比を更新
camera.updateProjectionMatrix();//カメラの射影行列を更新
}
);

</script>

</body>
</html>
